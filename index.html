<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monsoon Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: single-column phone menu, sticky category tabs, bottom cart bar that opens a sheet. */
:root{
  --bg:#f4efe2; --surface:#fbf8ef; --fg:#26301f; --muted:#6a7059; --line:#d9d2bd;
  --green:#2f5a2c; --green-ink:#ffffff; --rain:#5d8a7a; --chilli:#a8402a; --veg:#2f7d32; --nonveg:#a8402a;
  --shadow:0 6px 24px rgba(38,48,31,.12);
  --display:'Kaushan Script','Brush Script MT',cursive;
  --body:'Crimson Pro',Georgia,'Times New Roman',serif;
  --ui:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141c17; --surface:#1c2620; --fg:#e8eadb; --muted:#9aa58f; --line:#2f3b33;
  --green:#8fc27f; --green-ink:#10190f; --rain:#7fb3a2; --chilli:#e08467; --veg:#6fc274; --nonveg:#e08467;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c17; --surface:#1c2620; --fg:#e8eadb; --muted:#9aa58f; --line:#2f3b33;
  --green:#8fc27f; --green-ink:#10190f; --rain:#7fb3a2; --chilli:#e08467; --veg:#6fc274; --nonveg:#e08467;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rain);outline-offset:2px}

header{position:relative;text-align:center;padding:28px 0 14px;overflow:hidden}
.drops{position:absolute;inset:0;pointer-events:none;opacity:.5}
.drops i{position:absolute;top:-10px;width:2px;height:12px;border-radius:2px;background:var(--rain);animation:fall 3.4s linear infinite}
@keyframes fall{to{transform:translateY(190px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drops i{animation:none;opacity:.35}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,14vw,68px);line-height:1.05;margin:0;color:var(--green);position:relative}
.tag{font-style:italic;color:var(--muted);margin:6px 0 0;position:relative}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:640px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--ui);font-weight:500;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}

section{padding-top:22px;scroll-margin-top:64px}
h2{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:15px;font-family:var(--ui);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{margin:0 0 6px;color:var(--muted);font-style:italic;font-size:16px}

.item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.ph{width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:46px;height:46px;stroke:var(--rain);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;gap:8px;align-items:flex-start}
.dot{flex:none;width:14px;height:14px;border:1.5px solid var(--veg);border-radius:3px;display:grid;place-items:center;margin-top:6px}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.dot.nv{border-color:var(--nonveg)}.dot.nv::after{background:var(--nonveg)}
.name{font-weight:700;font-size:19px;line-height:1.2;margin:0}
.desc{margin:3px 0 0;color:var(--muted);font-style:italic;font-size:16px;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.price{font-family:var(--ui);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.add{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.06em;padding:9px 22px;border-radius:10px;border:1.5px solid var(--green);background:var(--surface);color:var(--green)}
.add:active{transform:scale(.97)}
.step{display:inline-flex;align-items:center;border-radius:10px;background:var(--green);color:var(--green-ink);font-family:var(--ui);font-weight:700}
.step button{width:38px;height:36px;border:0;background:transparent;font-size:20px;line-height:1;color:inherit}
.step span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.badge{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chilli);margin-top:4px;display:block}

.foot{padding:26px 0 0;text-align:center;color:var(--muted);font-style:italic;font-size:15px}

/* cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.barbtn{display:flex;width:100%;max-width:640px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:14px;padding:14px 18px;background:var(--green);color:var(--green-ink);font-family:var(--ui);font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.barbtn small{font-weight:500;opacity:.85;font-size:12px;display:block}
.bar[hidden]{display:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--green)}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{border:1px solid var(--line);background:transparent;width:38px;height:38px;border-radius:50%;font-size:18px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.li .n{min-width:0;font-weight:700}
.li .n small{display:block;font-weight:400;color:var(--muted);font-family:var(--ui);font-size:12px}
.li .amt{font-family:var(--ui);font-weight:700;font-size:15px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;padding:14px 0 4px;font-family:var(--ui);font-weight:700;font-size:18px}
.note{color:var(--muted);font-style:italic;font-size:15px;margin:0 0 14px}
label{display:block;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.place{display:block;text-align:center;text-decoration:none;margin-top:18px;border-radius:14px;padding:15px;background:var(--green);color:var(--green-ink);font-family:var(--ui);font-weight:700;font-size:16px}
.place[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ghost{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px;font-family:var(--ui);font-weight:500;font-size:14px}
.clear{border:0;background:none;color:var(--chilli);font-family:var(--ui);font-weight:500;font-size:13px;text-decoration:underline;padding:6px 0}
.empty{text-align:center;color:var(--muted);padding:34px 0;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-family:var(--ui);font-size:13px;padding:9px 16px;border-radius:999px}
</style>

<div class="wrap">
  <header>
    <div class="drops" id="drops" aria-hidden="true"></div>
    <h1>Monsoon Menu</h1>
    <p class="tag">Crispy, spiced and best eaten while it rains</p>
  </header>
  <nav><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="menu"></main>
  <p class="foot">Government taxes as applicable. T&amp;C apply.</p>
</div>

<div class="bar" id="bar" hidden>
  <button class="barbtn" id="openCart" type="button">
    <span id="barCount">0 items<small>View your order</small></span>
    <span id="barTotal">₹0</span>
  </button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Your order">
    <div class="shead"><h3>Your order</h3><button class="x" id="closeCart" type="button" aria-label="Close">✕</button></div>
    <div id="lines"></div>
    <div class="tot"><span>Total</span><span id="grand">₹0</span></div>
    <p class="note">Government taxes extra, as applicable.</p>
    <div class="two">
      <div><label for="cname">Your name</label><input id="cname" autocomplete="name" placeholder="Aarav"></div>
      <div><label for="ctable">Table no.</label><input id="ctable" inputmode="text" placeholder="12"></div>
    </div>
    <label for="cnote">Cooking note (optional)</label>
    <textarea id="cnote" rows="2" placeholder="Less spicy, no onion..."></textarea>
    <a class="place" id="place" href="#" target="_blank" rel="noopener" aria-disabled="true">Place order on WhatsApp</a>
    <button class="ghost" id="copy" type="button">Copy order text</button>
    <button class="clear" id="clear" type="button">Clear cart</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
